[package]
name = "pustol-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Two binaries live here — the server and the one-off seeder — so `cargo run -p pustol-api` has to be
# told which one is the point of the crate.
default-run = "pustol-api"

[lib]
name = "pustol_api"
path = "src/lib.rs"

[[bin]]
name = "pustol-api"
path = "src/main.rs"

[dependencies]
pustol-db = { workspace = true }
pustol-domain = { workspace = true }
pustol-telegram = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
# `raw_value`: body checked and parsed from same raw bytes.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
# Only this crate needs these: `fs` static build, `set-status` real 404, `set-header` cache and
# security headers, compression for app bundles on weak mobile signal.
tower-http = { workspace = true, features = ["fs", "set-status", "set-header", "compression-gzip", "compression-br"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono-tz = { workspace = true }
http-body-util = "0.1"
sqlx = { workspace = true }
pustol-telegram = { workspace = true, features = ["test-signing"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

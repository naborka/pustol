[workspace]
resolver = "3"
members = [
    "crates/pustol-domain",
    "crates/pustol-db",
    "crates/pustol-telegram",
    "crates/pustol-api",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
pustol-domain = { path = "crates/pustol-domain" }
pustol-db = { path = "crates/pustol-db" }
pustol-telegram = { path = "crates/pustol-telegram" }

anyhow = "1.0"
axum = "0.8"
axum-extra = { version = "0.12", features = ["typed-header"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
hex = "0.4"
hmac = "0.13"
jsonwebtoken = "11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
